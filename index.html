<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="每日视觉表达训练复习站">
    <title>每日视觉表达训练｜复习站</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="wrap">
      <header class="site-header">
        <p class="eyebrow">VISUAL TRAINING REVIEW</p>
        <h1>每日视觉表达训练｜复习站</h1>
        <p class="sub">视觉语言 · AI画面描述 · 摄影眼 · 配色 · 构图</p>
      </header>
      <nav class="page-nav" aria-label="页面入口">
        <button class="nav-button active" type="button" data-view="training">每日训练</button>
        <button class="nav-button" type="button" data-view="vocabulary">我的视觉词库</button>
        <button class="nav-button" type="button" data-view="weaknesses">我的高频弱项</button>
      </nav>
      <section id="training-view" class="view" aria-live="polite">
        <nav id="day-nav" class="day-nav" aria-label="训练日期"></nav>
        <div id="training-content"></div>
      </section>
      <section id="vocabulary-view" class="view" hidden></section>
      <section id="weaknesses-view" class="view" hidden></section>
      <p id="load-error" class="load-error" role="alert" hidden></p>
    </main>
    <script src="js/app.js" defer></script>
  </body>
</html>
